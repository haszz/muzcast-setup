appId: co.muzcast.setup
afterPack: scripts/mac-identity.cjs
# Keep internal bundle/helper names ASCII: accented productName crashed before JS on macOS 27.
# CFBundleDisplayName below retains the French user-facing name.
productName: Muzcast Setup
executableName: MuzcastSetup
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/dns-probe.dex
    to: dns-probe.dex
  - from: resources/app-metadata.dex
    to: app-metadata.dex
  - from: resources/upstream
    to: upstream
  - from: resources/licenses
    to: licenses
# Fuses are switches baked into the Electron binary. Off: running the app as plain Node, NODE_OPTIONS
# and --inspect, which would let another program borrow the app's identity and network permission.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  # onlyLoadAppFromAsar stays off: with it the unsigned build exits at launch, and it adds little
  # without code signing and asar integrity checks.
mac:
  extraResources:
    - from: resources/relay
      to: relay
  category: public.app-category.utilities
  icon: build/icon.icns
  # No Developer ID certificate, so sign ad hoc ("-"). Left unsigned, the bundle keeps Electron's
  # linker signature, which no longer matches once the app is renamed and its Info.plist and fuses are
  # changed: Gatekeeper then calls a downloaded copy "damaged" on Apple silicon instead of offering
  # Open. Hardened runtime stays off: its library validation needs a Team ID, which ad hoc signing
  # lacks, and it only matters for notarization, which needs that certificate anyway.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
  # The scan and ADB connection reach devices on the home network.
  extendInfo:
    CFBundleDisplayName: Muzcast à la maison
    NSBonjourServices: ["_adb._tcp", "_androidtvremote2._tcp", "_adb-tls-connect._tcp", "_adb-tls-pairing._tcp"]
    NSLocalNetworkUsageDescription: Muzcast se connecte à votre téléviseur Android sur votre réseau local.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
protocols:
  - name: Muzcast Setup
    schemes: [muzcastsetup]
nsis:
  include: build/attribution.nsh
  # Hyphens, not spaces: GitHub turns spaces in release asset names into dots.
  artifactName: Muzcast-Setup-${version}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target: AppImage
